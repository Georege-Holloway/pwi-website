# Static site, no build step. Netlify publishes the repo root as is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# STAGING ONLY. This header keeps the Netlify preview out of search results so
# it cannot compete with www.pwilimited.co.uk while the site is under review.
#
# DELETE THIS ENTIRE [[headers]] BLOCK AT CUTOVER, or the live site will be
# de-indexed. This is the single most important line in the repo.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
